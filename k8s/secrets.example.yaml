# TEMPLATE, not applied by kustomize. Copy to k8s/secrets.yaml (git-ignored), change every value, then:
#   kubectl apply -f k8s/secrets.yaml
# In production prefer SealedSecrets / External Secrets / your cloud secret manager over a file.
# "Maximum Pool Size": every replica opens its own pool. replicas x pool size must stay under PostgreSQL max_connections
# (100 by default): 20 per pod leaves room for about 4 pods of each service; use PgBouncer / a pooler to go further.
apiVersion: v1
kind: Secret
metadata: { name: migrator-secrets, namespace: genkan }
stringData:
  ConnectionStrings__Postgres: "Host=postgres;Database=genkan;Username=genkan;Password=CHANGE_ME"
---
apiVersion: v1
kind: Secret
metadata: { name: auth-secrets, namespace: genkan }
stringData:
  ConnectionStrings__Postgres: "Host=postgres;Database=genkan;Username=genkan;Password=CHANGE_ME;Maximum Pool Size=20"
  ConnectionStrings__Redis: "redis:6379,password=CHANGE_ME,abortConnect=false"
  Seed__AdminEmail: "admin@example.com"
  Seed__AdminPassword: "CHANGE_ME_at_least_12_chars"
---
apiVersion: v1
kind: Secret
metadata: { name: lab-secrets, namespace: genkan }
stringData:
  ConnectionStrings__Postgres: "Host=postgres;Database=genkan;Username=genkan;Password=CHANGE_ME;Maximum Pool Size=20"
  RabbitMq__User: "genkan"
  RabbitMq__Password: "CHANGE_ME"
---
apiVersion: v1
kind: Secret
metadata: { name: notification-secrets, namespace: genkan }
stringData:
  ConnectionStrings__Postgres: "Host=postgres;Database=genkan;Username=genkan;Password=CHANGE_ME;Maximum Pool Size=20"
  RabbitMq__User: "genkan"
  RabbitMq__Password: "CHANGE_ME"
---
apiVersion: v1
kind: Secret
metadata: { name: gateway-secrets, namespace: genkan }
stringData:
  ConnectionStrings__Redis: "redis:6379,password=CHANGE_ME,abortConnect=false"
---
# Only with the KEDA overlay: how KEDA reaches RabbitMQ (AMQP URI)
apiVersion: v1
kind: Secret
metadata: { name: keda-rabbitmq, namespace: genkan }
stringData:
  host: "amqp://genkan:CHANGE_ME@rabbitmq:5672/"
---
# Only for the dev-infra.yaml stack (postgres, redis, rabbitmq inside the cluster)
apiVersion: v1
kind: Secret
metadata: { name: postgres-auth, namespace: genkan }
stringData:
  POSTGRES_PASSWORD: "CHANGE_ME"
---
apiVersion: v1
kind: Secret
metadata: { name: redis-auth, namespace: genkan }
stringData:
  REDIS_PASSWORD: "CHANGE_ME"
---
apiVersion: v1
kind: Secret
metadata: { name: rabbitmq-auth, namespace: genkan }
stringData:
  RABBITMQ_DEFAULT_USER: "genkan"
  RABBITMQ_DEFAULT_PASS: "CHANGE_ME"
# Firebase service-account key (when Firebase__Enabled=true), from the file, never from a manifest:
#   kubectl -n genkan create secret generic firebase-service-account --from-file=firebase.json=secrets/firebase-service-account.json
