# Non-secret settings, same keys as the docker-compose environment. Secrets are in secrets.example.yaml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-config
data:
  ASPNETCORE_ENVIRONMENT: Production
  ASPNETCORE_HTTP_PORTS: "8080"
  # The gateway sits behind the ingress: take the real client IP from X-Forwarded-For (trusts every proxy, so the gateway
  # must only be reachable through the ingress - see networkpolicy.yaml). Without it every anonymous request (login) is
  # rate limited as ONE client, the ingress.
  ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
  Services__AuthUrl: http://auth:8080
  Swagger__Enabled: "false"
  # Several gateway replicas: the buckets must live in Redis (ConnectionStrings__Redis is in gateway-secrets)
  RateLimiting__Enabled: "true"
  RateLimiting__Store: Redis
  RateLimiting__Policies__user__Key: User
  RateLimiting__Policies__user__Capacity: "30"
  RateLimiting__Policies__user__RefillTokens: "30"
  RateLimiting__Policies__user__RefillPeriodSeconds: "60"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-config
data:
  ASPNETCORE_ENVIRONMENT: Production
  ASPNETCORE_HTTP_PORTS: "8080"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: lab-config
data:
  ASPNETCORE_ENVIRONMENT: Production
  ASPNETCORE_HTTP_PORTS: "8080"
  RabbitMq__Host: rabbitmq
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: notification-config
data:
  ASPNETCORE_ENVIRONMENT: Production
  ASPNETCORE_HTTP_PORTS: "8080"
  RabbitMq__Host: rabbitmq
  # "true" once the firebase-service-account secret exists (the service refuses to start with Firebase enabled and no valid key)
  Firebase__Enabled: "false"
  Firebase__ProjectId: ""
  GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase/firebase.json
  # Public identifiers served to the mobile app by GET /notifications/firebase-config (not secrets)
  Firebase__Client__ApiKey: ""
  Firebase__Client__ApplicationId: ""
  Firebase__Client__MessagingSenderId: ""
  Firebase__Client__ProjectId: ""
