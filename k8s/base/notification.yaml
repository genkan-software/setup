apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification
  labels:
    app.kubernetes.io/name: notification
    app.kubernetes.io/component: notification
spec:
  # no "replicas": the HorizontalPodAutoscaler owns it, otherwise every apply would reset it
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: notification
  template:
    metadata:
      labels:
        app.kubernetes.io/name: notification
        app.kubernetes.io/component: notification
    spec:
      terminationGracePeriodSeconds: 30
      # imagePullSecrets: [{ name: ghcr }]      # when the GHCR packages are private
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654          # the "app" user of the .NET images
        runAsGroup: 1654
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: notification
      containers:
        - name: notification
          image: ghcr.io/genkan-software/genkan-notification:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: notification-config
            - secretRef:
                name: notification-secrets
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { memory: 384Mi }       # no CPU limit: it would throttle the pods before the autoscaler reacts
          # /health checks the dependencies of the service: it decides readiness, never liveness
          # (a database outage must stop traffic, not restart every pod)
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            tcpSocket: { port: http }
            periodSeconds: 20
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]        # let the endpoints controller remove the pod before it stops accepting requests
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: firebase
              mountPath: /run/secrets/firebase
              readOnly: true
      volumes:
        - name: firebase
          secret:
            secretName: firebase-service-account
            optional: true           # only needed when Firebase__Enabled=true
---
apiVersion: v1
kind: Service
metadata:
  name: notification
  labels:
    app.kubernetes.io/name: notification
spec:
  selector:
    app.kubernetes.io/name: notification
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: notification
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: notification
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: notification
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: notification
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - { type: Percent, value: 100, periodSeconds: 60 }
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - { type: Pods, value: 1, periodSeconds: 60 }
